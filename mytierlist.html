<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tier Lists - Suniverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <header class="app-title">
            <a href="index.html" class="icon-button portal-home-link">
                <span class="material-symbols-outlined">hub</span>
                Portal
            </a>
            <h1>My Tier Lists</h1>
            <div class="header-right-buttons">
                <a href="ocn.html" class="icon-button home-link">
                    <span class="material-symbols-outlined">arrow_back</span>
                    OCN
                </a>
                <button id="logout-button" class="icon-button logout-button">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </header>

        <div class="mypage-tabs">
            <button class="tab-btn active" data-type="ocn">🎬 OCN</button>
            <button class="tab-btn" data-type="books">📚 Books</button>
        </div>

        <div class="tierlist-container" id="tierlist-container">
            <div class="tierlist-column" id="tier-column-me">
                <h2>지형 티어</h2>
                <div class="tier-content" id="tier-content-me"></div>
            </div>
            <div class="tierlist-column" id="tier-column-partner">
                <h2>수인 티어</h2>
                <div class="tier-content" id="tier-content-partner"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay">
        <div class="modal-content">
            <div id="details-view">
                <div class="details-layout">
                    <img id="modal-poster" src="" alt="포스터">
                    <div class="details-info">
                        <h2 id="modal-title">제목</h2>
                        <div id="modal-credits"></div>
                        <p id="modal-overview"></p>
                    </div>
                </div>
                <div class="modal-actions">
                    <button id="show-review-view-btn">리뷰 쓰기 / 수정</button>
                </div>
            </div>
            <div id="review-view" style="display: none;">
                <h2 id="review-modal-title">리뷰 작성</h2>

                <div class="review-user-block my-review-block">
                    <div class="review-user-label" id="my-user-label">지형</div>
                    <div class="tier-select-group">
                        <label for="tier-my">티어</label>
                        <select id="tier-my">
                            <option value="">선택안함</option>
                            <option value="S">S</option>
                            <option value="A+">A+</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                    <textarea id="review-textarea" placeholder="이 작품에 대한 당신의 생각을 남겨보세요..."></textarea>
                </div>

                <div class="review-user-block partner-review-block" id="partner-review-block">
                    <div class="review-user-label partner-label" id="partner-user-label">수인</div>
                    <div class="partner-tier-row">
                        <span class="partner-tier-badge" id="partner-tier-badge"></span>
                    </div>
                    <p class="partner-review-text" id="partner-review-text">아직 작성된 리뷰가 없습니다.</p>
                </div>

                <div class="modal-buttons">
                    <button id="back-to-details-btn">돌아가기</button>
                    <button id="save-button">저장</button>
                </div>
            </div>
            <button class="close-button">&times;</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="auth.js" defer></script>
    <script src="mytierlist.js" defer></script>
</body>

</html>
